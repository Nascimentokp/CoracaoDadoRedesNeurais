# Instale os hooks com: uv run pre-commit install
# Atualize as versões com: uv run pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=5000"]

  # O ruff roda pela versão travada no uv.lock, a mesma do `uv run invoke lint`:
  # uma versão fixa aqui divergiria das regras de formatação usadas no dia a dia.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

  # Remove os outputs dos notebooks antes do commit
  # (evita diffs gigantes e vazamento de dados sensíveis)
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
