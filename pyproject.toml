[project]
name = "src"
version = "0.1.0"
description = "Redes neurais (deep learning) para prever doença cardiovascular na base Coração de Dados"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.2",
    "numpy>=1.26.0",
    "matplotlib>=3.9.1",
    "seaborn>=0.13.2",
    "scikit-learn>=1.5.1",
    "joblib>=1.4.0",
    "tensorflow>=2.18.0",
    "torch>=2.4.0",
    "shap>=0.46.0",
    "lime>=0.2.0.1",
    "jupyterlab>=4.3.0",
    "ipywidgets>=8.1.3",
    "streamlit>=1.40.0",
    "keras-tuner>=1.4.8",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.6",
    "python-dotenv>=1.2.3",
    "tensorboard>=2.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "invoke>=2.2.0",
    "nbformat>=5.10.0",
    "nbconvert>=7.16.0",
    "ipykernel>=6.29.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# PyTorch só de CPU no Linux (GitHub Actions): o pacote padrão traz ~3 GB de CUDA.
# No macOS e no Windows nada muda.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
